<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Overwatch Directive — Executive</title>
  <link rel="icon" href="data:," />
  <style>
    :root {
      --bg: #0b0e14;
      --panel: #10141d;
      --panel-border: #1e2634;
      --text: #c7d0dd;
      --dim: #6b7687;
      --blue: #4da3ff;
      --red: #ff5f56;
      --amber: #ffb84d;
      --green: #4dd97a;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font: 13px/1.45 ui-monospace, 'Cascadia Code', Menlo, Consolas, monospace;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    header {
      display: flex; align-items: center; gap: 14px;
      padding: 8px 14px;
      background: var(--panel);
      border-bottom: 1px solid var(--panel-border);
      flex-wrap: wrap;
    }
    header .title { font-weight: 700; letter-spacing: 0.08em; color: #e8eef7; }
    header .title span { color: var(--blue); }
    .clock { font-size: 16px; font-weight: 700; color: #e8eef7; min-width: 92px; }
    .group { display: flex; gap: 4px; align-items: center; }
    .group .lbl { color: var(--dim); margin-right: 2px; }
    button {
      background: #17202e; color: var(--text);
      border: 1px solid #263349; border-radius: 4px;
      font: inherit; padding: 3px 10px; cursor: pointer;
    }
    button:hover { background: #1d2939; }
    button.on { background: #14304f; border-color: var(--blue); color: #bcdcff; }
    button.danger.on { background: #46201d; border-color: var(--red); color: #ffc9c5; }
    button:disabled { opacity: 0.45; cursor: default; }
    select {
      background: #17202e; color: var(--text);
      border: 1px solid #263349; border-radius: 4px;
      font: inherit; padding: 3px 6px;
    }
    main { flex: 1; display: flex; min-height: 0; }
    #mapwrap { flex: 1; position: relative; min-width: 0; }
    canvas { display: block; width: 100%; height: 100%; cursor: crosshair; }
    #banner {
      position: absolute; top: 14px; left: 50%; transform: translateX(-50%);
      padding: 6px 18px; border-radius: 4px; font-weight: 700; letter-spacing: 0.1em;
      display: none; pointer-events: none;
    }
    #banner.success { display: block; background: #123322cc; border: 1px solid var(--green); color: var(--green); }
    #banner.failure { display: block; background: #3a1614cc; border: 1px solid var(--red); color: var(--red); }
    #help {
      position: absolute; bottom: 10px; right: 12px; color: var(--dim);
      font-size: 11px; text-align: right; pointer-events: none;
    }
    aside {
      width: 340px; background: var(--panel);
      border-left: 1px solid var(--panel-border);
      display: flex; flex-direction: column; min-height: 0;
    }
    aside section { padding: 10px 12px; border-bottom: 1px solid var(--panel-border); }
    aside h3 {
      margin: 0 0 6px; font-size: 11px; letter-spacing: 0.12em;
      color: var(--dim); text-transform: uppercase; font-weight: 700;
    }
    #unitpanel .row { display: flex; justify-content: space-between; margin: 2px 0; }
    #unitpanel .row .k { color: var(--dim); }
    #unitpanel .actions { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
    #eventlog { flex: 1; overflow-y: auto; padding: 8px 12px; min-height: 0; }
    #eventlog .ev { margin: 1px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #eventlog .t { color: var(--dim); }
    .ev.blue { color: var(--blue); } .ev.red { color: var(--red); }
    .ev.warn { color: var(--amber); } .ev.good { color: var(--green); }
    footer {
      display: flex; align-items: center; gap: 12px;
      padding: 8px 14px; background: var(--panel);
      border-top: 1px solid var(--panel-border);
    }
    #scrubber { flex: 1; accent-color: var(--blue); }
    #scrubinfo { color: var(--dim); min-width: 150px; text-align: right; }
    .fuelbar { height: 5px; background: #1a2230; border-radius: 2px; overflow: hidden; margin-top: 2px; }
    .fuelbar > div { height: 100%; background: var(--green); }
    .fuelbar.low > div { background: var(--amber); }
  </style>
</head>
<body>
  <header>
    <div class="title">OVERWATCH <span>DIRECTIVE</span> // EXECUTIVE</div>
    <div class="clock" id="clock">T+00:00</div>
    <div class="group" id="speeds">
      <span class="lbl">TIME</span>
      <button data-speed="0">⏸</button>
      <button data-speed="1">1×</button>
      <button data-speed="4">4×</button>
      <button data-speed="15">15×</button>
      <button data-speed="60">60×</button>
      <button id="step">+1s</button>
    </div>
    <div class="group" id="roe">
      <span class="lbl">ROE</span>
      <button data-roe="HOLD" class="danger">HOLD</button>
      <button data-roe="TIGHT">TIGHT</button>
      <button data-roe="FREE">FREE</button>
    </div>
    <div class="group">
      <span class="lbl">SCENARIO</span>
      <select id="scenario">
        <option value="strike-basic">strike-basic (static IADS)</option>
        <option value="strike-adaptive">strike-adaptive (EMCON + scoot)</option>
      </select>
    </div>
    <div class="group">
      <button id="godview">TRUTH VIEW</button>
      <button id="reset">RESET MISSION</button>
    </div>
  </header>
  <main>
    <div id="mapwrap">
      <canvas id="map"></canvas>
      <div id="banner"></div>
      <div id="help">
        click: select unit · right-click: waypoint (shift: append) ·<br/>
        drag: pan · wheel: zoom
      </div>
    </div>
    <aside>
      <section id="unitpanel"><h3>No unit selected</h3></section>
      <section style="flex:1; display:flex; flex-direction:column; min-height:0; padding:0;">
        <h3 style="padding:10px 12px 0;">Mission log</h3>
        <div id="eventlog"></div>
      </section>
    </aside>
  </main>
  <footer>
    <span class="lbl" style="color:var(--dim)">TIMELINE</span>
    <input type="range" id="scrubber" min="0" max="0" value="0" />
    <span id="scrubinfo"></span>
  </footer>
  <script type="module" src="/web/main.ts"></script>
</body>
</html>
